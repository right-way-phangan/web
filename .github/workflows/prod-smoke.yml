# Production smoke: every 30 min by schedule AND right after each successful
# Production deploy (Vercel → deployment_status). The catalog lives on the own
# API, so an expired token or outage empties /listings silently; a bad deploy
# can ship an empty __next_error__ document or the home page's og:title on
# every route (both happened on 2026-09-04 and were caught by hand).
# Failures alert Vladimir via @rightway_admin_notify_bot.
name: Prod smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  deployment_status:
  workflow_dispatch:

jobs:
  smoke:
    # deployment_status fires for every Vercel status (preview, pending…):
    # run only for a finished Production deploy; schedule/dispatch always run.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - name: Check production
        id: check
        run: |
          fail() { echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "FAILED: $1"; exit 1; }
          # Fresh deploys take a minute to propagate to the edge — give it a moment.
          [ "${{ github.event_name }}" = "deployment_status" ] && sleep 60

          code=$(curl -s --max-time 30 -o /tmp/home.html -w '%{http_code}' https://rightwaygroup.co/) || fail "home unreachable"
          [ "$code" = "200" ] || fail "home HTTP $code"
          grep -q "Right Way" /tmp/home.html || fail "home content broken"

          code=$(curl -s --max-time 30 -o /tmp/listings.html -w '%{http_code}' https://rightwaygroup.co/listings) || fail "listings unreachable"
          [ "$code" = "200" ] || fail "listings HTTP $code"
          # Skip RW-P#### project cards — they 307-redirect to /projects/[slug]
          # by design, so /object/RW-P#### is never a 200. Pick a real object.
          rw=$(grep -o 'href="/object/RW-[A-Z0-9-]*"' /tmp/listings.html | sed 's/href="\/object\///;s/"//' | grep -v '^RW-P' | head -1)
          [ -n "$rw" ] || fail "no listing cards on /listings (catalog feed down?)"

          code=$(curl -s --max-time 30 -o /tmp/object.html -w '%{http_code}' "https://rightwaygroup.co/object/$rw") || fail "object page unreachable"
          [ "$code" = "200" ] || fail "object $rw HTTP $code"

          # Content guard: EN pages must not leak Cyrillic (amoCRM fields slip
          # straight into the payload — it has happened twice already).
          for f in /tmp/home.html /tmp/listings.html /tmp/object.html; do
            cyr=$(grep -o '[А-Яа-яЁё]' "$f" | wc -l)
            [ "$cyr" -eq 0 ] || fail "cyrillic on EN page ($(basename "$f"): $cyr chars)"
          done

          # Content guard: cover photos must resolve — a deleted blob otherwise
          # sits as a silently broken card until someone happens to look.
          covers=$(grep -o 'coverImage\\":\\"https:[^"\\]*' /tmp/listings.html | sed 's/coverImage\\":\\"//' | head -12)
          [ -n "$covers" ] || fail "no cover URLs in listings payload"
          while IFS= read -r u; do
            c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -I "$u") || c=000
            [ "$c" = "200" ] || fail "broken cover ($c): $u"
          done <<< "$covers"

          # Page-shape guard across the key routes (EN + RU): expected status,
          # a rendered <h1>, no bare __next_error__ document, and an og:title
          # that belongs to the page — the home title on an inner page means
          # the root metadata leaked again (it did through 2026-09-03).
          home_og=$(grep -o 'property="og:title" content="[^"]*"' /tmp/home.html | head -1)
          [ -n "$home_og" ] || fail "home has no og:title"
          check_page() { # url expected_status
            local u="$1" want="$2" f=/tmp/page.html
            local c; c=$(curl -s --max-time 30 -o "$f" -w '%{http_code}' "https://rightwaygroup.co$u") || fail "$u unreachable"
            [ "$c" = "$want" ] || fail "$u HTTP $c (want $want)"
            grep -q '__next_error__' "$f" && fail "$u is a bare __next_error__ document"
            grep -q '<h1' "$f" || fail "$u has no <h1>"
            if [ "$want" = "200" ] && [ "$u" != "/" ] && [ "$u" != "/ru" ]; then
              local og; og=$(grep -o 'property="og:title" content="[^"]*"' "$f" | head -1)
              [ -n "$og" ] || fail "$u has no og:title"
              [ "$og" != "$home_og" ] || fail "$u carries the home og:title"
            fi
          }
          for u in /ru /listings /ru/listings /projects /ru/projects /knowledge /ru/knowledge /blog /districts /calculator /ru/calculator /contact /ru/contact /faq /sell /leasehold; do
            check_page "$u" 200
          done
          check_page "/no-such-page-smoke" 404
          check_page "/ru/no-such-page-smoke" 404

          echo "OK: home, listings ($rw), object page, no cyrillic, covers alive, 18 routes shaped"

      - name: Alert Telegram
        if: failure()
        run: |
          reason="${{ steps.check.outputs.reason }}"
          curl -s --max-time 20 "https://api.telegram.org/bot${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}" \
            --data-urlencode text="🔴 rightwaygroup.co — smoke провален (${{ github.event_name }}): ${reason:-unknown}. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null

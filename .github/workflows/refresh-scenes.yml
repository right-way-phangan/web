name: Refresh hero scenes

# Rebuilds public/scenes.json from the live catalog and commits it (push → Vercel redeploy).
#
# MANUAL-ONLY. The homepage hero now ships a hand-curated set of premium drone
# photos of Koh Phangan & the Gulf (public/hero/scene-*.jpg, see public/images/CREDITS.md).
# The old weekly schedule kept regenerating scenes.json from the catalog, which is
# land-heavy — so the hero filled with watermarked land-plot aerials. Auto-refresh is
# therefore disabled; run on demand only if you deliberately want catalog covers back.
#
# Requires repo secrets: OBJECTS_API_URL, OBJECTS_API_TOKEN (own backend, post-cutover).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Rebuild scene manifest
        env:
          OBJECTS_API_URL: ${{ secrets.OBJECTS_API_URL }}
          OBJECTS_API_TOKEN: ${{ secrets.OBJECTS_API_TOKEN }}
        run: node scripts/build-scenes.mjs --write

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/scenes.json; then
            echo "No scene changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/scenes.json
          git commit -m "chore(hero): refresh scene manifest from catalog"
          git push

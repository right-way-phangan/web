name: Refresh hero scenes

# Rebuilds public/scenes.json from the live catalog once a week and commits it.
# The push triggers a Vercel redeploy, so the homepage hero refreshes itself as
# inventory turns over — no manual edits. Also runnable on demand.
#
# Requires repo secrets: OBJECTS_API_URL, OBJECTS_API_TOKEN (own backend, post-cutover).

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild scene manifest
        env:
          OBJECTS_API_URL: ${{ secrets.OBJECTS_API_URL }}
          OBJECTS_API_TOKEN: ${{ secrets.OBJECTS_API_TOKEN }}
        run: node scripts/build-scenes.mjs --write

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/scenes.json; then
            echo "No scene changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/scenes.json
          git commit -m "chore(hero): refresh scene manifest from catalog"
          git push

name: Daily knowledge guides

# Autonomous content routine: once a day, headless Claude Code authors 2 new
# knowledge guides (EN+RU) grounded in live web sources, following
# content-pipeline/routine.md. A tsc gate validates before anything is committed;
# the push triggers a Vercel redeploy. Runs entirely in the cloud — no laptop needed.
#
# Required repo secret:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` on a Pro/Max subscription.
# Uses the built-in GITHUB_TOKEN to push to main (no extra secret).

on:
  schedule:
    # GitHub delays scheduled runs ~4–5h, so 19:41 UTC fires late-evening UTC and the
    # guides commit lands ~07:00 Asia/Bangkok next morning. The Telegram ping at the end
    # announces the exact landing time, so the GH delay never leaves you guessing.
    - cron: "41 19 * * *" # 19:41 UTC → commit ≈ 07:00 Asia/Bangkok (after GH ~4–5h delay)
  workflow_dispatch:
    inputs:
      count:
        description: "How many guides to author this run (default 2)"
        required: false
        default: "2"

permissions:
  contents: write
  actions: write # dispatch discover-topics.yml when the backlog runs low (closes the loop)

concurrency:
  group: daily-guides
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    # Ceiling for 3 bounded retries (≤75 min each) + ~15 min authoring + overhead.
    # If the account is under continuous load the whole night, the run gives up here
    # rather than tying a runner up for hours (public repo — Actions minutes are free).
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Self-replenishing loop: authoring drains the backlog (~2/day) faster than the
      # weekly scout refills it (~10/week), so left alone it would slowly empty again —
      # exactly what stalled guides after 2026-06-30. Here daily-guides watches its own
      # fuel gauge and dispatches the discovery scout the moment the queue runs low, so
      # the two workflows form a closed cycle instead of two independent crons. Fire-and-
      # forget: the dispatched scout refills for upcoming runs; today authors from what's
      # already queued. (workflow_dispatch is the documented exception to GITHUB_TOKEN's
      # no-recursion rule, so this dispatch does start a real run.)
      - name: Refill backlog if running low (closes the loop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          THRESHOLD=6
          QUEUED="$(grep -c '⏳' content-pipeline/backlog.md || true)"
          echo "Queued topics: ${QUEUED:-0} (refill threshold: ${THRESHOLD})"
          if [ "${QUEUED:-0}" -lt "$THRESHOLD" ]; then
            echo "Backlog low — dispatching the topic-discovery scout to refill."
            gh workflow run discover-topics.yml --ref main \
              && echo "Scout dispatched; fresh topics land shortly for upcoming runs." \
              || echo "::warning::Could not dispatch discover-topics.yml (check actions:write permission)."
          else
            echo "Backlog healthy — no refill needed."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Author guides (headless Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GUIDE_COUNT: ${{ github.event.inputs.count || '2' }}
        run: |
          set -eo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Run 'claude setup-token' and add it to repo secrets."
            exit 1
          fi
          PROMPT="$(cat content-pipeline/routine.md)
          (This run: author up to ${GUIDE_COUNT} guides.)"
          # Pass the prompt as a positional argument — the form bot/council.py invokes
          # reliably — not via an `echo | claude` stdin pipe: since mid-June the piped form
          # stopped being treated as the task, so the agent wandered and committed nothing.
          # --verbose surfaces tool calls/errors; pipefail (above) propagates a non-zero
          # claude exit through `tee` instead of masking it as a green run.
          #
          # Session-limit retry: the cron fires ~03:00-04:00 Asia/Bangkok, right at the
          # boundary where the Max subscription's 5h usage window resets after evening
          # work (7 of 10 runs on 2026-07-03..12 died with "You've hit your session
          # limit"). On that specific failure we sleep until the window resets and retry;
          # any other error still fails immediately.
          #
          # Waits are BOUNDED at 75 min/attempt (not the full 5h window): at the nightly
          # cron time the reset is normally minutes-to-an-hour away, so one short wait
          # catches it. A 2026-07-13 manual test at midday proved the pathological case —
          # run head-to-head with an active interactive session, the reset time kept
          # sliding forward every retry (continuous concurrent usage) and the old 5.5h cap
          # just tied a runner up for 6h producing nothing. Capping low means each retry
          # re-reads a fresh reset time, and a genuinely un-winnable night gives up in
          # ~3.5h instead of ~22h — tomorrow's run catches the backlog up either way.
          attempt=0
          max_attempts=3
          while :; do
            attempt=$((attempt + 1))
            echo "----- author attempt ${attempt}/${max_attempts} -----"
            set +e
            claude --print --verbose --dangerously-skip-permissions "$PROMPT" 2>&1 | tee claude-run.log
            claude_status=$?
            set -e
            if [ "$claude_status" -eq 0 ]; then
              break
            fi
            if ! grep -qi "hit your session limit" claude-run.log; then
              echo "::error::claude exited ${claude_status} with a non-session-limit error. See the claude-run-log artifact."
              exit "$claude_status"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Session limit still exhausted after ${max_attempts} attempts."
              exit 1
            fi
            # Parse "resets 8:40pm (UTC)" / "resets 2:10am (UTC)"; fall back to 45 min.
            reset_at="$(grep -oiE 'resets [0-9]{1,2}(:[0-9]{2})?(am|pm)' claude-run.log | head -1 | cut -d' ' -f2 || true)"
            now="$(date -u +%s)"
            wait_s=2700
            if [ -n "$reset_at" ]; then
              reset_epoch="$(date -u -d "$reset_at" +%s 2>/dev/null || echo 0)"
              if [ "$reset_epoch" -gt 0 ]; then
                [ "$reset_epoch" -le "$now" ] && reset_epoch=$((reset_epoch + 86400))
                wait_s=$((reset_epoch - now + 180))
              fi
            fi
            [ "$wait_s" -gt 4500 ] && wait_s=4500 # cap at 75 min — see note above; don't wait out a whole 5h window
            echo "Session limit hit — sleeping $((wait_s / 60)) min until the window resets (${reset_at:-time unknown})."
            sleep "$wait_s"
            # A partial attempt may have dirtied the tree — reset so the retry starts clean.
            git checkout -- .
            git clean -fd >/dev/null
          done
          echo "----- working tree after author run -----"
          git status --porcelain
          # Tripwire: routine.md REQUIRES overwriting last-run.md every run. If it is
          # untouched, the headless agent wrote nothing — fail loudly instead of going green
          # while committing nothing (the silent failure that stalled new guides since 2026-06-16).
          if git diff --quiet -- content-pipeline/last-run.md; then
            echo "::error::Headless Claude made no edits (content-pipeline/last-run.md unchanged). See the claude-run-log artifact."
            exit 1
          fi
          # Consistency tripwire: if last-run.md claims N>0 guides published, knowledge-base.ts
          # MUST have changed. On 2026-07-01 the agent reported "Guides published: 2" while
          # knowledge-base.ts was untouched (hallucinated authorship) — the run went green and
          # nothing landed. Publishing 0 guides (backlog exhausted) is legitimate and skips this.
          published="$(grep -oE 'Guides published:[^0-9]*[0-9]+' content-pipeline/last-run.md | grep -oE '[0-9]+' | head -1 || true)"
          if [ "${published:-0}" -gt 0 ] && git diff --quiet -- src/content/knowledge-base.ts; then
            echo "::error::last-run.md claims ${published} guides but src/content/knowledge-base.ts is unchanged — the agent reported authorship it did not perform. Failing loudly."
            exit 1
          fi

      - name: Type-check gate
        run: npx tsc --noEmit

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage only pipeline + content outputs
          git add src/content/knowledge-base.ts src/content/knowledge-base.ru.ts \
                  content-pipeline/backlog.md content-pipeline/last-run.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new guides this run (backlog exhausted or quality gate). Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          git commit -m "content: daily knowledge guides ($DATE) [auto]

          Authored by headless Claude Code via content-pipeline/routine.md.

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          # main may have moved during the long run — rebase on reject and retry.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase conflict — aborting."; git rebase --abort; exit 1; }
          done
          echo "::error::Could not push after retries."
          exit 1

      - name: Notify Telegram — guides ready
        if: steps.commit.outputs.committed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: |
          # last-run.md is overwritten every successful run (routine.md requires it).
          # greps guarded with || true: default shell is `bash -eo pipefail`, so a
          # no-match grep (exit 1) would otherwise fail the step.
          n="$(grep -oE 'Guides published:[^0-9]*[0-9]+' content-pipeline/last-run.md | grep -oE '[0-9]+' | head -1 || true)"
          titles="$(grep -E 'title \(RU\):' content-pipeline/last-run.md | sed -E 's/.*title \(RU\):\**[[:space:]]*/• /' || true)"
          today="$(date -u +%Y-%m-%d)"
          msg="$(printf '📚 Новые гайды на сайте: %s шт (%s)\n%s\n→ rightwaygroup.co (после редеплоя Vercel)' "${n:-?}" "$today" "$titles")"
          curl -s --max-time 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="$msg" \
            >/dev/null

      - name: Notify Telegram — run failed
        # Failures were silent for a week (2026-07-03..12): GH emails went unread and
        # guides just stopped. Ping the same chat the success message uses.
        # cancelled() too: a job-timeout cancel (retries never won the window) is a
        # failure from our side but reports as `cancelled`, which failure() misses.
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: |
          msg="⚠️ daily-guides упал ($(date -u +%Y-%m-%d)) — гайды сегодня не вышли.
          Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s --max-time 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="$msg" \
            >/dev/null || true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-run-log
          path: |
            claude-run.log
            content-pipeline/last-run.md
          if-no-files-found: ignore
          retention-days: 14
